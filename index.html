<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .header {
          color: green;
            font-size: 30px;
            padding: 20px 40px;
        }

        .fix-top-right {
            position: fixed;
            right: 0;
            top: 0;
        }
    </style>

</head>
<body>
    <h1 class="fix-top-right header" style="color: red">Заголовок</h1>
    <p>Это мой текст</p>
    <a href="/index.html">Ссылка</a>
    <div id="myDiv" class="header">
        123
    </div>
    <img src="https://habrastorage.org/getpro/moikrug/uploads/company/100/004/431/7/logo/medium_83b5009e040969ee7b60362ad7426573.jpeg" alt="Картинка"/>
    <ul>
        <li>Первый элемент</li>
        <li>Второй элемент</li>
        <li>Третий элемент</li>
    </ul>
    <button id="btn">Нажать</button>
    <input type="text" id="text" name="text" placeholder="Ввести">

    <script>
        let a = 10
        let b = 20
        let int = null

        const elem = document.getElementById('myDiv')
        if (elem) {
            int = setInterval(() => {
                elem.innerHTML = a++;
            }, 100)
        }

        const btn = document.getElementById('btn')
        btn.addEventListener('click', () => {
            if (int) {
                clearInterval(int)
                int = null
            } else {
                int = setInterval(() => {
                    elem.innerHTML = a++;
                }, 100)
            }
        })
    </script>
</body>
</html>
